name: Audit Prompt Families V3

on:
  push:
    branches:
      - audit/prompt-dedup-v1
    paths:
      - 'tools/audit_prompt_families_v3.py'
      - '.github/workflows/audit-prompt-families-v3.yml'
      - 'android/app/src/main/assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install semantic dependencies
        run: python -m pip install --disable-pip-version-check sentence-transformers==5.1.1 scikit-learn==1.7.2
      - name: Run multi-threshold family analysis
        run: python tools/audit_prompt_families_v3.py
      - name: Show summary
        run: sed -n '1,70p' audit/PROMPT_FAMILY_ANALYSIS_V3.md
      - name: Commit report
        run: |
          git config user.name 'PromptDeck Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add audit/PROMPT_FAMILY_ANALYSIS_V3.md audit/PROMPT_FAMILY_ANALYSIS_V3.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add canonical prompt family analysis V3'
            git push origin HEAD:audit/prompt-dedup-v1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-family-analysis-v3
          path: |
            audit/PROMPT_FAMILY_ANALYSIS_V3.md
            audit/PROMPT_FAMILY_ANALYSIS_V3.json
