name: Bootstrap PromptDeck Source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PromptDeck
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch last known PromptDeck build source
        run: |
          git clone --depth 1 --branch promptdeck-build-v0.2.0 https://github.com/KAN1409/Cortex.git /tmp/cortex
          cat /tmp/cortex/promptdeck-build/chunks/* > /tmp/PromptDeck.b64
          base64 -d /tmp/PromptDeck.b64 > /tmp/PromptDeck.zip
          rm -rf /tmp/pd
          mkdir -p /tmp/pd
          unzip -o /tmp/PromptDeck.zip -d /tmp/pd
          cp /tmp/cortex/promptdeck-build/MainActivity.java /tmp/pd/PromptDeck/app/src/main/java/com/kareem/promptdeck/MainActivity.java
          python3 /tmp/cortex/promptdeck-build/patch-ui-rc2.py
          python3 /tmp/cortex/promptdeck-build/patch-ui-rc3.py
          python3 /tmp/cortex/promptdeck-build/patch-ui-rc4.py
          python3 /tmp/cortex/promptdeck-build/patch-ui-rc5-github.py
          python3 /tmp/cortex/promptdeck-build/patch-ui-rc6-photo.py
          python3 /tmp/cortex/promptdeck-build/patch-ui-rc7-parser-fix.py
          python3 /tmp/cortex/promptdeck-build/patch-ui-rc9-extra-photo-codes.py
          python3 /tmp/cortex/promptdeck-build/patch-ui-rc10-satin-nav.py
          python3 /tmp/cortex/promptdeck-build/patch-ui-rc11-safe-area.py
          python3 /tmp/cortex/promptdeck-build/patch-ui-rc12-english-brand.py
          sed -i 's/((ClipboardManager)/((android.content.ClipboardManager)/' /tmp/pd/PromptDeck/app/src/main/java/com/kareem/promptdeck/MainActivity.java

      - name: Make repository self-contained
        run: |
          rm -rf android
          mkdir -p android
          cp -a /tmp/pd/PromptDeck/. android/
          rm -rf android/.gradle android/app/build android/build
          mkdir -p migration/legacy-patches
          cp /tmp/cortex/promptdeck-build/patch-ui-*.py migration/legacy-patches/
          cp /tmp/cortex/promptdeck-build/MainActivity.java migration/MainActivity-pre-patches.java

      - name: Commit canonical source
        run: |
          git config user.name 'PromptDeck Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add android migration
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Bootstrap canonical PromptDeck Android source'
          git push origin HEAD:main
