name: Build Capability Router UX V1

on:
  push:
    branches: [ ux/capability-router-v1 ]
    paths:
      - 'audit/apply_capability_router_v1.py'
      - '.github/workflows/build-capability-router-v1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply capability-router UX
        run: python3 audit/apply_capability_router_v1.py

      - name: Verify UX source gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('android/app/src/main/java/com/kareem/promptdeck/MainActivity.java').read_text()
          g=Path('android/app/build.gradle').read_text()
          for token in ['What do you want to accomplish?','Find anything','Explore the full library','primaryNavV18','Work with an image','Plan or decide']:
              assert token in s, token
          assert 'versionCode 46' in g
          assert "versionName '0.9.0-capability-router'" in g
          print('Capability-router UX source gates PASS')
          PY

      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/kareem/promptdeck/MainActivity.java android/app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m 'feat: apply intent-first capability router UX'
            git push origin HEAD:ux/capability-router-v1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Verify APK identity
        run: |
          yes | sdkmanager 'build-tools;35.0.0' >/dev/null
          DBG=android/app/build/outputs/apk/debug/app-debug.apk
          REL=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$DBG" && test -f "$REL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DBG" > /tmp/badging.txt
          grep "package: name='com.kareem.promptdeck'" /tmp/badging.txt
          grep "versionCode='46'" /tmp/badging.txt
          grep "versionName='0.9.0-capability-router'" /tmp/badging.txt
          cp "$DBG" /tmp/PromptDeck-v0.9.0-capability-router-debug.apk
          cp "$REL" /tmp/PromptDeck-v0.9.0-capability-router-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PromptDeck-v0.9.0-capability-router-v1
          path: |
            /tmp/PromptDeck-v0.9.0-capability-router-debug.apk
            /tmp/PromptDeck-v0.9.0-capability-router-release-unsigned.apk
            /tmp/badging.txt
