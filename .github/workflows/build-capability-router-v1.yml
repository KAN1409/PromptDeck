name: Build Capability Router UX V1

on:
  push:
    branches: [ ux/capability-router-v1 ]
    paths:
      - 'audit/fix_router_anr_v3.py'
      - '.github/workflows/build-capability-router-v1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply ANR-safe routing fix
        run: python3 audit/fix_router_anr_v3.py

      - name: Verify UX and ANR source gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('android/app/src/main/java/com/kareem/promptdeck/MainActivity.java').read_text()
          g=Path('android/app/build.gradle').read_text()
          for token in [
              'What do you want to accomplish?', 'Find anything', 'Explore the full library',
              'renderCapabilityRecommendationAsyncV20', 'renderCompoundWorkflowAsyncV20',
              'renderFallbackAsyncV20', 'PromptDeckRankFlow', 'routeStillValidV20',
              'cat.equals("Work & Business")', 'cat.equals("Planning & Decisions")',
              'cat.equals("Technology & Data")', 'cat.equals("Research & Analysis")',
              'cat.equals("Learning & Education")', 'cat.equals("Writing & Communication")',
              '"Images & Design".equals(cat)'
          ]:
              assert token in s, token
          assert 'renderCompoundWorkflowV8(target,q,route)' not in s
          assert 'renderCapabilityRecommendationV8(target,q,askCapability)' not in s
          assert 'versionCode 48' in g
          assert "versionName '0.9.2-anr-fix'" in g
          print('Capability-router ANR regression gates PASS')
          PY

      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/kareem/promptdeck/MainActivity.java android/app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m 'fix: keep capability ranking off the UI thread'
            git push origin HEAD:ux/capability-router-v1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Verify APK identity
        run: |
          yes | sdkmanager 'build-tools;35.0.0' >/dev/null
          DBG=android/app/build/outputs/apk/debug/app-debug.apk
          REL=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$DBG" && test -f "$REL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DBG" > /tmp/badging.txt
          grep "package: name='com.kareem.promptdeck'" /tmp/badging.txt
          grep "versionCode='48'" /tmp/badging.txt
          grep "versionName='0.9.2-anr-fix'" /tmp/badging.txt
          cp "$DBG" /tmp/PromptDeck-v0.9.2-anr-fix-debug.apk
          cp "$REL" /tmp/PromptDeck-v0.9.2-anr-fix-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PromptDeck-v0.9.2-anr-fix
          path: |
            /tmp/PromptDeck-v0.9.2-anr-fix-debug.apk
            /tmp/PromptDeck-v0.9.2-anr-fix-release-unsigned.apk
            /tmp/badging.txt
