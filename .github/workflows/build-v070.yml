# PromptDeck v0.8.1 — approved visual lock + ChatGPT-native final catalog
name: Build PromptDeck v0.8.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v070.yml'
      - 'tools/**'
      - 'audit/apply_v081_design_and_chatgpt_native.py'
      - 'audit/apply_v081_pixel_lock_v2.py'
      - 'audit/fix_v081_java_escapes.py'
      - 'audit/PROMPTDECK_V081_DESIGN_LOCK_CHECKLIST.md'
      - 'audit/chatgpt_native_final_data/**'
      - 'android/app/build.gradle'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/java/com/kareem/promptdeck/**'
      - 'android/app/src/main/assets/**'
      - 'android/app/src/main/res/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PromptDeck
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build integrated prompt data
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/f/prompts.chat/414b71ae0be4e25564543d4b5ecb3bcd1e7c9876/prompts.csv \
            -o /tmp/prompts.csv
          python3 tools/build_prompt_library.py /tmp/prompts.csv android/app/src/main/assets/prompts_library.json 2160
          python3 tools/build_curated_photo_prompts.py android/app/src/main/assets/curated_photo_prompts.json
          cat android/app/src/main/assets/imported_pdf_prompts_01.b64 \
              android/app/src/main/assets/imported_pdf_prompts_02.b64 \
              android/app/src/main/assets/imported_pdf_prompts_03.b64 \
              android/app/src/main/assets/imported_pdf_prompts_04.b64 \
              android/app/src/main/assets/imported_pdf_prompts_05.b64 > /tmp/imported_pdf_prompts.b64
          base64 -d /tmp/imported_pdf_prompts.b64 | gunzip > android/app/src/main/assets/imported_pdf_prompts.json
          python3 - <<'PY'
          import json
          core=json.load(open('android/app/src/main/assets/prompts_library.json',encoding='utf-8'))
          photo=json.load(open('android/app/src/main/assets/curated_photo_prompts.json',encoding='utf-8'))
          imported=json.load(open('android/app/src/main/assets/imported_pdf_prompts.json',encoding='utf-8'))
          daily=json.load(open('android/app/src/main/assets/daily_gap_prompts_100.json',encoding='utf-8'))
          assert len(core)==2160, len(core)
          assert len(photo)==198, len(photo)
          assert len(imported)==806, len(imported)
          assert len(daily)==100, len(daily)
          print('Integrated source verified:',len(core),'+',len(photo),'+',len(imported),'+',len(daily))
          PY

      - name: Apply canonical catalog and Navigation V2
        run: |
          python3 tools/patch_main_v070.py
          python3 tools/fix_legacy_java_escapes.py
          python3 tools/patch_category_browser_v071.py
          python3 tools/patch_curated_photo_v072.py
          python3 tools/patch_smart_paste_v074.py
          python3 tools/patch_imported_pdf_prompts_v075.py
          python3 tools/patch_daily_gap_v076.py
          python3 tools/patch_export_all_v077.py
          python3 tools/patch_onepass_canonical_v078.py
          python3 tools/patch_navigation_v2_v080.py

      - name: Apply v0.8.1 ChatGPT-native catalog and visual lock
        run: |
          python3 audit/apply_v081_design_and_chatgpt_native.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_pixel_lock_v2.py
          python3 audit/fix_v081_java_escapes.py

      - name: Verify v0.8.1 source and design gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          main=Path('android/app/src/main/java/com/kareem/promptdeck/MainActivity.java').read_text(encoding='utf-8')
          gradle=Path('android/app/build.gradle').read_text(encoding='utf-8')
          pack=json.load(open('android/app/src/main/assets/chatgpt_native_final.json',encoding='utf-8'))
          assert pack['expected_builtin_count']==3375, pack['expected_builtin_count']
          assert "versionCode 25" in gradle
          assert "versionName '0.8.1'" in gradle
          required=[
            'Find the right prompt','Quick Goals','Smart Collections',
            'LinearLayout bottomNav()','void searchPage()','void settings()',
            'Browse Categories','Variables (optional)','Add to Stack',
            'Run with ChatGPT','Run Stack with ChatGPT','My Prompts',
            'displayTitle(Cmd c)','resolveTemplate(Cmd c,String user)',
            'applyChatGPTNativeFinal()','gradientShape(ACCENT,PURPLE',
            'R.drawable.promptdeck_mark','R.drawable.pd_nav_home','R.drawable.pd_nav_search',
            'R.drawable.pd_nav_stack','R.drawable.pd_nav_document','R.drawable.pd_nav_settings',
            'base("Settings","",false)','base("Search","",false)',
            'base("Prompt Stack","",false)','base("My Prompts","",false)'
          ]
          for token in required: assert token in main, token
          for p in ['promptdeck_mark.xml','pd_nav_home.xml','pd_nav_search.xml','pd_nav_stack.xml','pd_nav_document.xml','pd_nav_settings.xml']:
            assert Path('android/app/src/main/res/drawable/'+p).exists(), p
          assert 'base("Prompt Library"' not in main
          assert 'menuCard("⌕","Prompt Library"' not in main
          if re.search(r'[\u0600-\u06FF]',main): raise AssertionError('Arabic visible/source UI text remains')
          assert not re.search(r'(?<!\\)\\s',main), 'single-backslash Java \\s escape remains'
          nav=main[main.index('LinearLayout bottomNav()'):main.index('View navItem(',main.index('LinearLayout bottomNav()'))]
          assert nav.count('navItem(')==5, nav.count('navItem(')
          # Proposal structure: brand row is conditional to Home, not global.
          base=main[main.index('void base('):main.index('LinearLayout bottomNav()',main.index('void base('))]
          assert 'if("home".equals(page))' in base
          assert 'TextView brand=text("PromptDeck"' in base
          print('v0.8.1 source gates PASS: pixel-lock v2 + five-tab navigation + ChatGPT-native runtime + 3375 target')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/PromptDeck-v0.8.1-badging.txt | head -20
          cp "$APK" /tmp/PromptDeck-v0.8.1.apk
          sha256sum "$APK" | tee /tmp/PromptDeck-v0.8.1.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PromptDeck-v0.8.1-pixel-lock-v2
          path: |
            /tmp/PromptDeck-v0.8.1.apk
            /tmp/PromptDeck-v0.8.1.sha256
            /tmp/PromptDeck-v0.8.1-badging.txt
          if-no-files-found: error
