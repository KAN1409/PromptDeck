# PromptDeck v0.8.1 — capability-first Ask or Browse workspace
name: Build PromptDeck v0.8.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v070.yml'
      - 'tools/**'
      - 'audit/apply_v081_design_and_chatgpt_native.py'
      - 'audit/apply_v081_pixel_lock_v2.py'
      - 'audit/apply_v081_pixel_identical_v3.py'
      - 'audit/apply_v081_organization_fix_v4.py'
      - 'audit/apply_v081_two_page_ui_v5.py'
      - 'audit/apply_v081_hybrid_one_screen_v6.py'
      - 'audit/apply_v081_runtime_stability_v7.py'
      - 'audit/apply_v081_capability_router_v8.py'
      - 'audit/fix_v081_capability_compile_v8.py'
      - 'audit/apply_v081_debug_copy_prompt_v9.py'
      - 'audit/apply_v081_stability_ux_v10.py'
      - 'audit/fix_v081_java_escapes.py'
      - 'audit/PROMPTDECK_V081_DESIGN_LOCK_CHECKLIST.md'
      - 'audit/chatgpt_native_final_data/**'
      - 'android/app/build.gradle'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/java/com/kareem/promptdeck/**'
      - 'android/app/src/main/assets/**'
      - 'android/app/src/main/res/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PromptDeck
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build integrated prompt data
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/f/prompts.chat/414b71ae0be4e25564543d4b5ecb3bcd1e7c9876/prompts.csv \
            -o /tmp/prompts.csv
          python3 tools/build_prompt_library.py /tmp/prompts.csv android/app/src/main/assets/prompts_library.json 2160
          python3 tools/build_curated_photo_prompts.py android/app/src/main/assets/curated_photo_prompts.json
          cat android/app/src/main/assets/imported_pdf_prompts_01.b64 \
              android/app/src/main/assets/imported_pdf_prompts_02.b64 \
              android/app/src/main/assets/imported_pdf_prompts_03.b64 \
              android/app/src/main/assets/imported_pdf_prompts_04.b64 \
              android/app/src/main/assets/imported_pdf_prompts_05.b64 > /tmp/imported_pdf_prompts.b64
          base64 -d /tmp/imported_pdf_prompts.b64 | gunzip > android/app/src/main/assets/imported_pdf_prompts.json
          python3 - <<'PY'
          import json
          assert len(json.load(open('android/app/src/main/assets/prompts_library.json',encoding='utf-8')))==2160
          assert len(json.load(open('android/app/src/main/assets/curated_photo_prompts.json',encoding='utf-8')))==198
          assert len(json.load(open('android/app/src/main/assets/imported_pdf_prompts.json',encoding='utf-8')))==806
          assert len(json.load(open('android/app/src/main/assets/daily_gap_prompts_100.json',encoding='utf-8')))==100
          PY

      - name: Apply canonical catalog and Navigation V2 base
        run: |
          python3 tools/patch_main_v070.py
          python3 tools/fix_legacy_java_escapes.py
          python3 tools/patch_category_browser_v071.py
          python3 tools/patch_curated_photo_v072.py
          python3 tools/patch_smart_paste_v074.py
          python3 tools/patch_imported_pdf_prompts_v075.py
          python3 tools/patch_daily_gap_v076.py
          python3 tools/patch_export_all_v077.py
          python3 tools/patch_onepass_canonical_v078.py
          python3 tools/patch_navigation_v2_v080.py

      - name: Apply v0.8.1 ChatGPT-native workspace and capability router
        run: |
          python3 audit/apply_v081_design_and_chatgpt_native.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_pixel_lock_v2.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_pixel_identical_v3.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_organization_fix_v4.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_two_page_ui_v5.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_hybrid_one_screen_v6.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_runtime_stability_v7.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_capability_router_v8.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/fix_v081_capability_compile_v8.py
          python3 audit/apply_v081_debug_copy_prompt_v9.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_stability_ux_v10.py
          python3 audit/fix_v081_java_escapes.py

      - name: Verify v10 source and runtime gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          main=Path('android/app/src/main/java/com/kareem/promptdeck/MainActivity.java').read_text(encoding='utf-8')
          router=Path('android/app/src/main/java/com/kareem/promptdeck/CapabilityRouter.java').read_text(encoding='utf-8')
          gradle=Path('android/app/build.gradle').read_text(encoding='utf-8')
          pack=json.load(open('android/app/src/main/assets/chatgpt_native_final.json',encoding='utf-8'))
          assert pack['expected_builtin_count']==3375
          assert "versionCode 33" in gradle
          assert "versionName '0.8.1'" in gradle
          required=['How do you want to start?','Ask PromptDeck','Browse all prompts','Find the best approach','View selectionBar()','void showStackSheet()','Review & Run','void renderBrowseResultsV6','void showPromptDialog(Cmd c)','resolveTemplate(Cmd c,String user)','applyChatGPTNativeFinal()','applyProposalTaxonomy()','fastSmartScore(Cmd c,String[] toks)','runAskRecommendation(LinearLayout target,EditText goal)','if(!"landing".equals(discoverMode))','void renderAskResultsV8','void renderCapabilityChooserV8','void renderImageModeChooserV8','void renderCapabilityRecommendationV8','ArrayList<Cmd> rankCapabilityV8','CapabilityRouter.route(q)','String composeStackPromptV9(String user)','void copyPromptTextV9(String value)','Button copyPrompt=secondary("Copy prompt")','String askSelectionGoal="";','void beginAskSelectionV10(String goal)','safePresentationTitleV10(Cmd c)','safePresentationOutcomeV10(Cmd c)']
          for token in required: assert token in main, token
          router_required=['z.equals("photo edit")','image.enhance','image.portrait','image.background','image.remove','image.light','image.frame','image.style','image.product','image.text','static boolean selfTest()','route("study")','route("compare two cars")','route("debug app crash")','route("write an email")','route("tailor my cv to this job")']
          for token in router_required: assert token in router, token
          def method(src, marker):
              st=src.index(marker); br=src.index('{',st); depth=0; ins=False; esc=False; quote=''; i=br
              while i<len(src):
                  ch=src[i]
                  if ins:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: ins=False
                  else:
                      if ch in ('"',"'"): ins=True; quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:return src[st:i+1]
                  i+=1
              raise AssertionError(marker)
          active_rank=method(main,'ArrayList<Cmd> rankSmart')+method(main,'int fastSmartScore')
          assert 'instruction' not in active_rank
          cap_rank=method(main,'int capabilityScoreV8')+method(main,'ArrayList<Cmd> rankCapabilityV8')
          assert 'instruction' not in cap_rank
          assert 'c.id>=50000&&c.id<50200' in cap_rank
          sheet=method(main,'void showStackSheet()')
          assert 'Copy prompt' in sheet and 'composeStackPromptV9(contextDraft)' in sheet
          best=method(main,'View bestCapabilityCardV8')
          assert 'beginAskSelectionV10(goal)' in best
          browse=method(main,'void renderBrowseResultsV6')
          assert 'askSelectionGoal=""' in browse
          assert not re.search(r'(?<!\\)\\s',main)
          print('v10 source gates PASS — goal-scoped Ask selections, safe presentation, exact copy prompt, 3375 canonical prompts')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run CapabilityRouter regression suite
        run: |
          rm -rf /tmp/router-smoke && mkdir -p /tmp/router-smoke/com/kareem/promptdeck
          cp android/app/src/main/java/com/kareem/promptdeck/CapabilityRouter.java /tmp/router-smoke/com/kareem/promptdeck/
          cat > /tmp/router-smoke/com/kareem/promptdeck/MainActivity.java <<'JAVA'
          package com.kareem.promptdeck;
          class MainActivity {
            static class Cmd {
              int id; String command,category,subcategory,description;
            }
          }
          JAVA
          cat > /tmp/router-smoke/com/kareem/promptdeck/RouterSmoke.java <<'JAVA'
          package com.kareem.promptdeck;
          public class RouterSmoke {
            public static void main(String[] args) {
              if (!CapabilityRouter.selfTest()) throw new AssertionError("CapabilityRouter.selfTest failed");
              check("photo edit", CapabilityRouter.IMAGE, true);
              check("study", CapabilityRouter.LEARNING, true);
              check("compare two cars", CapabilityRouter.DECISION, false);
              check("debug app crash", CapabilityRouter.CODE, false);
              check("write an email", CapabilityRouter.WRITING, false);
              check("tailor my cv to this job", CapabilityRouter.CAREER, false);
              check("verify this claim with sources", CapabilityRouter.RESEARCH, false);
              check("make a project roadmap", CapabilityRouter.PLANNING, false);
              System.out.println("CapabilityRouter v10 regression PASS");
            }
            static void check(String q,String domain,boolean broad){
              CapabilityRouter.Route r=CapabilityRouter.route(q);
              if(!domain.equals(r.domain)||r.broad!=broad)throw new AssertionError(q+" => "+r.domain+" broad="+r.broad);
            }
          }
          JAVA
          javac -d /tmp/router-smoke/out /tmp/router-smoke/com/kareem/promptdeck/*.java
          java -cp /tmp/router-smoke/out com.kareem.promptdeck.RouterSmoke

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/PromptDeck-v0.8.1-badging.txt | head -20
          cp "$APK" /tmp/PromptDeck-v0.8.1.apk
          sha256sum "$APK" | tee /tmp/PromptDeck-v0.8.1.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PromptDeck-v0.8.1-stability-ux-v10
          path: |
            /tmp/PromptDeck-v0.8.1.apk
            /tmp/PromptDeck-v0.8.1.sha256
            /tmp/PromptDeck-v0.8.1-badging.txt
          if-no-files-found: error
