# Rebuild after curated photo result-preview integration
name: Build PromptDeck v0.7.3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v070.yml'
      - 'tools/**'
      - 'android/app/build.gradle'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/java/com/kareem/promptdeck/**'
      - 'android/app/src/main/assets/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PromptDeck
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build integrated prompt data
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/f/prompts.chat/414b71ae0be4e25564543d4b5ecb3bcd1e7c9876/prompts.csv \
            -o /tmp/prompts.csv
          python3 tools/build_prompt_library.py /tmp/prompts.csv android/app/src/main/assets/prompts_library.json 2160
          python3 tools/build_curated_photo_prompts.py android/app/src/main/assets/curated_photo_prompts.json
          python3 - <<'PY'
          import json
          core=json.load(open('android/app/src/main/assets/prompts_library.json',encoding='utf-8'))
          photo=json.load(open('android/app/src/main/assets/curated_photo_prompts.json',encoding='utf-8'))
          assert len(core)==2160, len(core)
          assert len(photo)==198, len(photo)
          assert all(x.get('command') and x.get('instruction') and x.get('subcategory') for x in photo)
          assert sum(1 for x in photo if x.get('example_mode'))==198
          assert sum(1 for x in photo if x.get('example_urls'))>0
          print('Integrated prompt data verified:',len(core),'+',len(photo))
          PY

      - name: Apply categories, navigation and result previews
        run: |
          python3 tools/patch_main_v070.py
          python3 tools/fix_legacy_java_escapes.py
          python3 tools/patch_category_browser_v071.py
          python3 tools/patch_curated_photo_v072.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths=[
            Path('android/app/src/main/java/com/kareem/promptdeck/MainActivity.java'),
            Path('android/app/src/main/res/values/strings.xml')
          ]
          bad=[]
          for p in paths:
            s=p.read_text(encoding='utf-8')
            for i,line in enumerate(s.splitlines(),1):
              if re.search(r'[\u0600-\u06FF]',line):bad.append(f'{p}:{i}:{line[:160]}')
          if bad: raise SystemExit('Arabic visible UI text remains:\n'+'\n'.join(bad[:50]))
          main=paths[0].read_text(encoding='utf-8')
          assert 'void renderExamples(Cmd c' in main
          assert 'void loadRemoteImage(String url' in main
          print('English-only UI and example-preview audit passed')
          PY

      - name: Commit generated canonical v0.7.3 source
        run: |
          git config user.name 'PromptDeck Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add android/app/src/main/assets/prompts_library.json \
                  android/app/src/main/assets/curated_photo_prompts.json \
                  android/app/src/main/java/com/kareem/promptdeck/MainActivity.java
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate curated photo prompts with in-app result previews'
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
          cp "$APK" /tmp/PromptDeck-v0.7.3.apk
          sha256sum "$APK" | tee /tmp/PromptDeck-v0.7.3.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PromptDeck-v0.7.3-build
          path: |
            /tmp/PromptDeck-v0.7.3.apk
            /tmp/PromptDeck-v0.7.3.sha256
          if-no-files-found: error
