# Rebuild after integrated prompt catalog + Export All
name: Build PromptDeck v0.7.7

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v070.yml'
      - 'tools/**'
      - 'android/app/build.gradle'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/java/com/kareem/promptdeck/**'
      - 'android/app/src/main/assets/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PromptDeck
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build integrated prompt data
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/f/prompts.chat/414b71ae0be4e25564543d4b5ecb3bcd1e7c9876/prompts.csv \
            -o /tmp/prompts.csv
          python3 tools/build_prompt_library.py /tmp/prompts.csv android/app/src/main/assets/prompts_library.json 2160
          python3 tools/build_curated_photo_prompts.py android/app/src/main/assets/curated_photo_prompts.json
          cat android/app/src/main/assets/imported_pdf_prompts_01.b64 \
              android/app/src/main/assets/imported_pdf_prompts_02.b64 \
              android/app/src/main/assets/imported_pdf_prompts_03.b64 \
              android/app/src/main/assets/imported_pdf_prompts_04.b64 \
              android/app/src/main/assets/imported_pdf_prompts_05.b64 > /tmp/imported_pdf_prompts.b64
          base64 -d /tmp/imported_pdf_prompts.b64 | gunzip > android/app/src/main/assets/imported_pdf_prompts.json
          python3 - <<'PY'
          import json
          core=json.load(open('android/app/src/main/assets/prompts_library.json',encoding='utf-8'))
          photo=json.load(open('android/app/src/main/assets/curated_photo_prompts.json',encoding='utf-8'))
          imported=json.load(open('android/app/src/main/assets/imported_pdf_prompts.json',encoding='utf-8'))
          daily=json.load(open('android/app/src/main/assets/daily_gap_prompts_100.json',encoding='utf-8'))
          assert len(core)==2160, len(core)
          assert len(photo)==198, len(photo)
          assert len(imported)==806, len(imported)
          assert len(daily)==100, len(daily)
          print('Integrated prompt data verified:',len(core),'+',len(photo),'+',len(imported),'+',len(daily))
          PY

      - name: Apply app patches including Export All
        run: |
          python3 tools/patch_main_v070.py
          python3 tools/fix_legacy_java_escapes.py
          python3 tools/patch_category_browser_v071.py
          python3 tools/patch_curated_photo_v072.py
          python3 tools/patch_smart_paste_v074.py
          python3 tools/patch_imported_pdf_prompts_v075.py
          python3 tools/patch_daily_gap_v076.py
          python3 tools/patch_export_all_v077.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          main=Path('android/app/src/main/java/com/kareem/promptdeck/MainActivity.java').read_text(encoding='utf-8')
          if re.search(r'[\u0600-\u06FF]',main): raise SystemExit('Arabic visible UI text remains')
          assert 'Export All' in main
          assert 'void exportAllPack(Uri u)' in main
          assert 'EXPORT_ALL_REQ=1004' in main
          print('English-only UI and Export All audit passed')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
          cp "$APK" /tmp/PromptDeck-v0.7.7.apk
          sha256sum "$APK" | tee /tmp/PromptDeck-v0.7.7.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PromptDeck-v0.7.7-build
          path: |
            /tmp/PromptDeck-v0.7.7.apk
            /tmp/PromptDeck-v0.7.7.sha256
          if-no-files-found: error
