name: Build PromptDeck v0.8.1 v12 taxonomy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v081-v12.yml'
      - 'audit/apply_v081_taxonomy_v12.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PromptDeck
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build integrated prompt data
        run: |
          curl -L --fail --retry 3 https://raw.githubusercontent.com/f/prompts.chat/414b71ae0be4e25564543d4b5ecb3bcd1e7c9876/prompts.csv -o /tmp/prompts.csv
          python3 tools/build_prompt_library.py /tmp/prompts.csv android/app/src/main/assets/prompts_library.json 2160
          python3 tools/build_curated_photo_prompts.py android/app/src/main/assets/curated_photo_prompts.json
          cat android/app/src/main/assets/imported_pdf_prompts_01.b64 android/app/src/main/assets/imported_pdf_prompts_02.b64 android/app/src/main/assets/imported_pdf_prompts_03.b64 android/app/src/main/assets/imported_pdf_prompts_04.b64 android/app/src/main/assets/imported_pdf_prompts_05.b64 > /tmp/imported_pdf_prompts.b64
          base64 -d /tmp/imported_pdf_prompts.b64 | gunzip > android/app/src/main/assets/imported_pdf_prompts.json

      - name: Rebuild canonical base
        run: |
          python3 tools/patch_main_v070.py
          python3 tools/fix_legacy_java_escapes.py
          python3 tools/patch_category_browser_v071.py
          python3 tools/patch_curated_photo_v072.py
          python3 tools/patch_smart_paste_v074.py
          python3 tools/patch_imported_pdf_prompts_v075.py
          python3 tools/patch_daily_gap_v076.py
          python3 tools/patch_export_all_v077.py
          python3 tools/patch_onepass_canonical_v078.py
          python3 tools/patch_navigation_v2_v080.py

      - name: Apply v0.8.1 evolution through v12
        run: |
          python3 audit/apply_v081_design_and_chatgpt_native.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_pixel_lock_v2.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_pixel_identical_v3.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_organization_fix_v4.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_two_page_ui_v5.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_hybrid_one_screen_v6.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_runtime_stability_v7.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_capability_router_v8.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/fix_v081_capability_compile_v8.py
          python3 audit/apply_v081_debug_copy_prompt_v9.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_stability_ux_v10.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_quality_upgrade_v11.py
          python3 audit/fix_v081_java_escapes.py
          python3 audit/apply_v081_taxonomy_v12.py
          python3 audit/fix_v081_java_escapes.py

      - name: Verify v12 taxonomy gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          main=Path('android/app/src/main/java/com/kareem/promptdeck/MainActivity.java').read_text(encoding='utf-8')
          gradle=Path('android/app/build.gradle').read_text(encoding='utf-8')
          pack=json.load(open('android/app/src/main/assets/chatgpt_native_final.json',encoding='utf-8'))
          assert pack['expected_builtin_count']==3375
          assert 'versionCode 35' in gradle and "versionName '0.8.1'" in gradle
          cats=['Writing & Communication','Research & Analysis','Planning & Decisions','Work & Business','Technology & Data','Learning & Education','Creativity & Content','Images & Design','Health & Life']
          for c in cats: assert c in main,c
          assert main.count('new Group("","')>=9
          required=['String discoverSubcategory="";','String[] subcategoriesForV12(String cat)','String taxonomySubcategoryV12(Cmd c,String cat)','void showSubcategoryPickerV12()','int subcategoryCountV12(String cat,String sub)','discoverCategory+"  ›  "+discoverSubcategory','All subcategories','Browse by category']
          for t in required: assert t in main,t
          subs=['Rewrite & Polish','Emails & Messages','Long-form Writing','Copywriting','Translation & Language','Deep Research','Fact-checking & Sources','Summaries & Extraction','Compare & Evaluate','Analysis & Insights','Plans & Roadmaps','Projects & Execution','Decisions & Trade-offs','Productivity & Organization','Checklists & SOPs','Career & Jobs','Meetings & Workplace','Strategy & Operations','Marketing & Sales','Finance & Entrepreneurship','Coding & Implementation','Debugging & Troubleshooting','Code Review & Testing','Data & SQL','Systems & DevOps','AI & Prompting','Explain & Understand','Tutoring','Study & Revision','Quizzes & Practice','Teaching & Lessons','STEM & Academic','Brainstorming & Ideas','Storytelling & Creative Writing','Social Media','Scripts & Video','Branding & Creative Direction','Image Generation','Photo Editing & Restore','Portraits & People','Background & Cleanup','Lighting & Color','Product & Commercial','Style & Transformation','Graphics & Posters','Health & Wellness','Fitness & Nutrition','Habits & Self-Improvement','Relationships & Personal','Travel & Lifestyle']
          for x in subs: assert x in main,x
          # taxonomy pass must be metadata-first: no giant prompt body scan
          st=main.index('void applyProposalTaxonomy()'); en=main.index('boolean hasAny',st)
          tax=main[st:en]
          assert '.instruction' not in tax
          assert 'c.subcategory=taxonomySubcategoryV12(c,cat)' in tax
          # Browse must filter both levels.
          st=main.index('void renderBrowseResultsV6'); en=main.index('void showStackSheetMenu',st)
          browse=main[st:en]
          assert 'discoverCategory.equals(c.category)' in browse
          assert 'discoverSubcategory.equals(c.subcategory)' in browse
          assert not re.search(r'(?<!\\)\\s',main)
          print('v12 taxonomy gates PASS — 9 categories, 50 focused subcategories, nested browse filters, 3375 canonical prompts')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run CapabilityRouter regression suite
        run: |
          rm -rf /tmp/router-smoke && mkdir -p /tmp/router-smoke/com/kareem/promptdeck
          cp android/app/src/main/java/com/kareem/promptdeck/CapabilityRouter.java /tmp/router-smoke/com/kareem/promptdeck/
          cat > /tmp/router-smoke/com/kareem/promptdeck/MainActivity.java <<'JAVA'
          package com.kareem.promptdeck;
          class MainActivity { static class Cmd { int id; String command,category,subcategory,description; } }
          JAVA
          cat > /tmp/router-smoke/com/kareem/promptdeck/RouterSmoke.java <<'JAVA'
          package com.kareem.promptdeck;
          public class RouterSmoke { public static void main(String[] args){ if(!CapabilityRouter.selfTest())throw new AssertionError("selfTest failed"); System.out.println("Router regression PASS"); } }
          JAVA
          javac -d /tmp/router-smoke/out /tmp/router-smoke/com/kareem/promptdeck/*.java
          java -cp /tmp/router-smoke/out com.kareem.promptdeck.RouterSmoke

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/PromptDeck-v0.8.1-v12-badging.txt | head -20
          cp "$APK" /tmp/PromptDeck-v0.8.1-v12.apk
          sha256sum "$APK" | tee /tmp/PromptDeck-v0.8.1-v12.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PromptDeck-v0.8.1-taxonomy-v12
          path: |
            /tmp/PromptDeck-v0.8.1-v12.apk
            /tmp/PromptDeck-v0.8.1-v12.sha256
            /tmp/PromptDeck-v0.8.1-v12-badging.txt
          if-no-files-found: error
