name: Build PromptDeck v0.8.7 Visual Intake

on:
  push:
    branches: [ audit/final-consolidation-v15d ]
    paths:
      - 'audit/apply_visual_intake_v087.py'
      - '.github/workflows/build-v087-visual-intake.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/final-consolidation-v15d
          fetch-depth: 1

      - name: Apply visual intake feature
        run: |
          python3 audit/apply_visual_intake_v087.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('android/app/src/main/java/com/kareem/promptdeck/MainActivity.java').read_text()
          g=Path('android/app/build.gradle').read_text()
          assert 'PROMPTDECK_IMPORT_V1' in s
          assert 'importPromptDeckPayloadV17' in s
          assert 'Create from images' in s
          assert 'isPromptDeckImportV17(shared)' in s
          assert 'inferPromptCategoryV86' in s
          assert 'inferPromptSubcategoryV86' in s
          assert 'pastePromptFromClipboardV16' not in s
          assert 'versionCode 44' in g and "versionName '0.8.7'" in g
          print('v0.8.7 static gates PASS')
          PY

      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/kareem/promptdeck/MainActivity.java android/app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m 'feat: ChatGPT visual prompt intake protocol'
            git push origin HEAD:audit/final-consolidation-v15d
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Verify APK identity
        run: |
          sdkmanager 'build-tools;35.0.0' >/dev/null
          DBG=android/app/build/outputs/apk/debug/app-debug.apk
          REL=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$DBG" && test -f "$REL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DBG" | tee /tmp/badging.txt
          grep "package: name='com.kareem.promptdeck'" /tmp/badging.txt
          grep "versionCode='44'" /tmp/badging.txt
          grep "versionName='0.8.7'" /tmp/badging.txt
          cp "$DBG" /tmp/PromptDeck-v0.8.7-visual-intake-debug.apk
          cp "$REL" /tmp/PromptDeck-v0.8.7-visual-intake-release-unsigned.apk
          sha256sum /tmp/PromptDeck-v0.8.7-visual-intake-release-unsigned.apk > /tmp/release.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PromptDeck-v0.8.7-visual-intake
          path: |
            /tmp/PromptDeck-v0.8.7-visual-intake-debug.apk
            /tmp/PromptDeck-v0.8.7-visual-intake-release-unsigned.apk
            /tmp/release.sha256
            /tmp/badging.txt
