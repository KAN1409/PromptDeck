name: Build PromptDeck v0.8.8 Color Grading Pack

on:
  push:
    branches: [ audit/final-consolidation-v15d ]
    paths:
      - 'audit/add_akash_color_grading_v088.py'
      - '.github/workflows/build-v088-color-grading-pack.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply color grading prompt pack
        run: python3 audit/add_akash_color_grading_v088.py

      - name: Verify prompt payload
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('android/app/src/main/assets/final_catalog_v15.json')
          a=json.loads(p.read_text())
          names=['WarmGoldenHourColorGrade','MoodyCinematicColorGrade','TealOrangeColorGrade','FilmFadeColorGrade','DarkLuxuryColorGrade','CoolCleanColorGrade','VintageSummerColorGrade','MatteEditorialColorGrade']
          found=[x for x in a if x.get('command') in names]
          assert len(found)==8, len(found)
          assert all(x.get('category')=='Images & Design' for x in found)
          assert all(x.get('subcategory')=='Color & Mood' for x in found)
          assert all('Akashgraphxic' in x.get('source','') for x in found)
          assert len({x.get('instruction') for x in found})==8
          print('8-prompt source gate PASS')
          PY

      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/assets/final_catalog_v15.json android/app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add 8 cinematic color grading prompts'
            git push origin HEAD:audit/final-consolidation-v15d
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Verify APK identity
        run: |
          sdkmanager 'build-tools;35.0.0' >/dev/null
          DBG=android/app/build/outputs/apk/debug/app-debug.apk
          REL=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$DBG" && test -f "$REL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DBG" > /tmp/badging.txt
          grep "package: name='com.kareem.promptdeck'" /tmp/badging.txt
          grep "versionCode='45'" /tmp/badging.txt
          grep "versionName='0.8.8'" /tmp/badging.txt
          cp "$DBG" /tmp/PromptDeck-v0.8.8-color-grading-debug.apk
          cp "$REL" /tmp/PromptDeck-v0.8.8-color-grading-release-unsigned.apk
          sha256sum /tmp/PromptDeck-v0.8.8-color-grading-release-unsigned.apk > /tmp/release.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PromptDeck-v0.8.8-color-grading-pack
          path: |
            /tmp/PromptDeck-v0.8.8-color-grading-debug.apk
            /tmp/PromptDeck-v0.8.8-color-grading-release-unsigned.apk
            /tmp/release.sha256
            /tmp/badging.txt
