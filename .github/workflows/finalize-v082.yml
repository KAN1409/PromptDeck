name: Finalize PromptDeck 0.8.2

on:
  workflow_dispatch:
  push:
    branches: ['audit/final-consolidation-v15d']
    paths:
      - '.github/workflows/finalize-v082.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/final-consolidation-v15d
          fetch-depth: 1
      - name: Finalize runtime state and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          j=Path('android/app/src/main/java/com/kareem/promptdeck/MainActivity.java')
          s=j.read_text(encoding='utf-8')
          old='''find.setOnClickListener(v->runAskRecommendation(results,goal));goal.setOnEditorActionListener((v,action,event)->{if(action==EditorInfo.IME_ACTION_DONE){runAskRecommendation(results,goal);return true;}return false;});return;'''
          new='''find.setOnClickListener(v->runAskRecommendation(results,goal));goal.addTextChangedListener(new android.text.TextWatcher(){public void beforeTextChanged(CharSequence x,int st,int c,int a){}public void onTextChanged(CharSequence x,int st,int b,int c){askGoal=x.toString();}public void afterTextChanged(android.text.Editable e){}});goal.setOnEditorActionListener((v,action,event)->{if(action==EditorInfo.IME_ACTION_DONE){runAskRecommendation(results,goal);return true;}return false;});return;'''
          if old not in s: raise SystemExit('Ask state anchor not found')
          s=s.replace(old,new,1)
          assert 'askGoal=x.toString()' in s
          j.write_text(s,encoding='utf-8')

          g=Path('android/app/build.gradle')
          x=g.read_text(encoding='utf-8')
          x=re.sub(r'versionCode\s+\d+','versionCode 39',x,count=1)
          x=re.sub(r"versionName\s+'[^']+'","versionName '0.8.2'",x,count=1)
          g.write_text(x,encoding='utf-8')
          PY
      - name: Commit final runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/kareem/promptdeck/MainActivity.java android/app/build.gradle
          git diff --cached --quiet && exit 0
          git commit -m 'release: finalize PromptDeck 0.8.2 source'
          git push origin HEAD:audit/final-consolidation-v15d
