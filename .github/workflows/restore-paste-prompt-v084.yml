name: Build PromptDeck v0.8.5
on:
  push:
    branches: [audit/final-consolidation-v15d]
    paths:
      - audit/finalize_v085.py
      - .github/workflows/restore-paste-prompt-v084.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 audit/finalize_v085.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - working-directory: android
        run: gradle --no-daemon assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/PromptDeck-v0.8.5-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PromptDeck-v0.8.5-release
          path: /tmp/PromptDeck-v0.8.5-release-unsigned.apk
