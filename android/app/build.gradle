plugins { id 'com.android.application' }

android {
    namespace 'com.kareem.promptdeck'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kareem.promptdeck'
        minSdk 26
        targetSdk 35
        versionCode 43
        versionName '0.8.6'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
